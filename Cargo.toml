[package]
name = "ts-engine-rs"
version = "0.1.0"
edition = "2024"

[dependencies]

# Async runtime
tokio = { version = "1.45.1", features = ["full"] }

# Serialization
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

# instead of  anyhow
tracing = { version = "0.1.41", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-error={version = "0.2.1"}
color-eyre = { version = "0.6", features = [
  "capture-spantrace",
  "track-caller",
  "color-spantrace",
  "tracing-error",
] }
thiserror = "2.0.12"
tracing-forest = { version = "0.1.6", features = ["ansi", "ansi_term", "chrono", "env-filter", "full","uuid","tokio","serde"] }
uuid={version = "1.17.0",features = ["v4"]}
log = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12.20", features = ["json", "stream"] }


serde_v8 = {version = "0.260.0"}
# deno_ast = { version = "0.48", features = ["transpiling"] }  # Temporarily disabled due to API compatibility
deno_core = "0.351"
owo-colors = { version = "4.2.2", features = ["supports-colors", "alloc"] }
tracing-futures = { version = "0.2.5", features = ["tokio"] }
tracing-tree = { version = "0.4.0", features = ["time"] }
# deno_runtime = "0.216"  # Temporarily disabled due to SQLite conflicts
tracing-log = { version = "0.2", optional = true, default-features = false, features = [
    "std",
    "log-tracer",
] }
spandoc = {version="0.2.2"}
[dev-dependencies]
# Testing utilities
tokio-test = "0.4"
tempfile = "3.0"
serial_test = "3.0"
criterion = { version = "0.6", features = ["html_reports"] }
proptest = "1.0"
# env_logger = "0.11"
